[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "prp-protocol"
version = "0.0.2"
description = "Progressive Reasoning Protocol: specification and pure kernel"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE-APACHE", "NOTICE"]
authors = [{ name = "PRP Protocol Authors" }]
dependencies = []

[project.urls]
Repository = "https://github.com/entzauberung/prp"
Issues = "https://github.com/entzauberung/prp/issues"
Documentation = "https://github.com/entzauberung/prp#readme"

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9.0",
    "ruff>=0.6,<1.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/prp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
